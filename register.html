<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NovaNFT Marketplace</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e1747 0%, #121025 70%);
      padding: 24px;
      position: relative;
    }
    .auth-page-wrapper::before {
      content: '';
      position: absolute;
      top: 10%;
      right: 15%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(115, 91, 242, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      padding: 36px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
    }
    .auth-header-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-header-brand img {
      height: 48px;
      margin-bottom: 12px;
    }
    .auth-header-brand h3 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
      color: #fff;
    }
    .auth-header-brand p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }
    .input-pass-wrapper {
      position: relative;
    }
    .password-toggle-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header-brand">
        <a href="index.html">
          <img src="assets/images/logo/logo.svg" alt="NovaNFT Brand Logo">
        </a>
        <h3>Create Your Account</h3>
        <p>Join thousands of artists and collectors in the decentralized era</p>
      </div>

      <!-- Live Feedback Alert -->
      <div id="authFeedbackMessage" style="display:none;"></div>

      <form id="registerForm" class="mt-3">
        <div class="mb-3">
          <label class="form-label" style="font-size:12px; font-weight:700; color:var(--text-secondary);">Full Name</label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--bg-secondary); border-color:var(--border-color); color:var(--text-muted);">
              <i class="fa-regular fa-user"></i>
            </span>
            <input type="text" class="form-control" id="regName" placeholder="e.g. Alex Rivera" required style="background:var(--bg-primary); border-color:var(--border-color); color:#fff; font-size:14px;">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" style="font-size:12px; font-weight:700; color:var(--text-secondary);">Email Address</label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--bg-secondary); border-color:var(--border-color); color:var(--text-muted);">
              <i class="fa-regular fa-envelope"></i>
            </span>
            <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required style="background:var(--bg-primary); border-color:var(--border-color); color:#fff; font-size:14px;">
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label" style="font-size:12px; font-weight:700; color:var(--text-secondary);">Password</label>
            <div class="input-pass-wrapper">
              <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required style="background:var(--bg-primary); border-color:var(--border-color); color:#fff; font-size:14px; padding-right:40px;">
              <button type="button" class="password-toggle-btn" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label" style="font-size:12px; font-weight:700; color:var(--text-secondary);">Confirm Password</label>
            <div class="input-pass-wrapper">
              <input type="password" class="form-control" id="regConfirmPassword" placeholder="••••••••" required style="background:var(--bg-primary); border-color:var(--border-color); color:#fff; font-size:14px; padding-right:40px;">
              <button type="button" class="password-toggle-btn" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input custom-checkbox" type="checkbox" id="regTermsCheckbox" required checked>
          <label class="form-check-label" for="regTermsCheckbox" style="font-size:12px; color:var(--text-secondary);">
            I agree to the <a href="#" style="color:var(--primary-light);">Terms of Service</a> &amp; <a href="#" style="color:var(--primary-light);">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn-primary-nft w-100 py-3 mb-3" style="font-size:15px;">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="text-center mt-2 pt-3" style="border-top:1px solid var(--border-color); font-size:13px; color:var(--text-muted);">
        Already have an account? <a href="login.html" style="color:var(--primary-light); font-weight:700;">Sign In</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
